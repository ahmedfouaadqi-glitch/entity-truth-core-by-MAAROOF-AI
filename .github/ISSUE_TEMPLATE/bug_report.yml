name: Bug report
description: Report a reproducible issue in local profile preparation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include private entity data, credentials, API keys, or confidential business information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest synthetic or non-sensitive input that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Entity Truth Core version or commit
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point
      options:
        - TypeScript API
        - CLI
        - MCP stdio
        - Browser playground
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove names, URLs, and other sensitive data before posting.
    validations:
      required: true
